spring.application.name=backend

server.port=8080

# =========================
# MySQL
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/bus_ticket_db
spring.datasource.username=root
spring.datasource.password=

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET:dev-secret-key-for-bus-ticket-project-2026-very-long}
jwt.expiration-seconds=3600
jwt.issuer=bus-ticket-backend

# =========================
# Booking holds
# =========================
booking.hold-duration-minutes=10
booking.cleanup-interval-ms=30000